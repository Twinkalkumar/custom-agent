services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment to give the container GPU access (requires NVIDIA Container Toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  agent:
    build: .
    container_name: local-agent
    depends_on:
      - ollama
    ports:
      - "5000:5000"
    env_file:
      - .env   # copy .env.example to .env and fill in LLM_PROVIDER / OPENAI_API_KEY
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:1b
    volumes:
      # Mount so you can edit tasks/prompts and just restart — no rebuild needed
      - ./instructions.yaml:/app/instructions.yaml
    stdin_open: true   # keep stdin open (needed if you run the terminal version)
    tty: true           # allocate a pseudo-TTY

volumes:
  ollama_data:
